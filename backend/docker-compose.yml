services:
  postgres:
    image: postgres:16
    container_name: hackathon_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: hackathon_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: